<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alkatra:wght@400..700&family=Henny+Penny&family=Roboto+Slab:wght@100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

        <header class="header">
            <div class="logo">Logo</div>
            <input type="search" id="search" name="search" placeholder=". Search">
            <div><button class="user-btn" type="button">User</button></div>
        </header>
        <nav class="nav">
            <div class="sidebar">
                <button class="dash-btn" type="button">Dashboard</button>
                <button class="inv-btn" type="button">Inventory</button>
                <button class="ord-btn" type="button">Orders</button>
                <button class="rec-btn" type="button">Receiving</button>
                <button class="pic-btn" type="button">Picking</button>
                <button class="pac-btn" type="button">Packing</button>
                <button class="dis-btn" type="button">Dispatch</button>
                <button class="sto-btn" type="button">Stocktake</button>
            </div>
            <div class="bottom-sidebar">
                <button class="set-btn" type="button">Settings</button>
                <button class="adm-btn" type="button">Admin</button>
            </div>
        </nav>
        </nav>
        <main class="dashboard">
            <h1>Dashboard</h1>
            <div class="content">
                <div class="card">
                    <h3>Orders</h3>
                    <p>200</p>
                </div>
                <div class="card">
                    <h3>Picking</h3>
                    <p>80%</p>
                </div>
                <div class="card">
                    <h3>Stock</h3>
                    <p>12,000</p>
                </div>
                <div class="card">
                    <h3>Low Stock</h3>
                    <p>30</p>
                </div>
                <div class="card">
                    <h3>Exception</h3>
                    <p>8</p>
                </div>
            </div>
            <div class="orders">
                <div class="card">
                    <p class="title">Orders</p>
                    <p>Activity</p>
                </div>
            </div>
            <div class="status">
                <div class="card">
                    <p class="title">Warehouse</p>
                    <p>Status</p>
                </div>
            </div>
            <div class="activity">
                <div class="card">
                    <p class="title">Recent Activity</p>
                    <p>Random information</p>
                </div>
            </div>
        </main>

    </div>
</body>
</html>
